        // 初始化变量
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let results = {};
        
        // DOM元素
        const currentChapterEl = document.getElementById('current-chapter');
        const currentQuestionEl = document.getElementById('current-question');
        const questionTypeEl = document.getElementById('question-type');
        const optionsContainerEl = document.getElementById('options-container');
        const submitBtnEl = document.getElementById('submit-btn');
        const feedbackEl = document.getElementById('feedback');
        const prevBtnEl = document.getElementById('prev-btn');
        const nextBtnEl = document.getElementById('next-btn');
        const currentIndexEl = document.getElementById('current-index');
        const totalQuestionsEl = document.getElementById('total-questions');
        const chapterSelectEl = document.getElementById('chapter-select');
        const questionsNavEl = document.getElementById('questions-navigation');
        const completedCountEl = document.getElementById('completed-count');
        const accuracyRateEl = document.getElementById('accuracy-rate');
        const progressBarEl = document.getElementById('progress-bar');
        const modal = document.getElementById('announcement-modal');
        const closeBtn = document.querySelector('.close');
        const announcementBtn = document.getElementById('announcement-btn');
        
        // 显示弹窗
        function showAnnouncement() {
            modal.style.display = 'block';
        }

        // 关闭弹窗
        function closeAnnouncement() {
            modal.style.display = 'none';
        }

        // 点击关闭按钮关闭弹窗
        closeBtn.addEventListener('click', closeAnnouncement);

        // 点击弹窗外部关闭
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeAnnouncement();
            }
        });

        // 页面加载完成后显示公告
        window.addEventListener('load', () => {
            showAnnouncement();
        });

        // 点击公告按钮显示弹窗
        announcementBtn.addEventListener('click', showAnnouncement);
        // 初始化应用
        function initApp() {
            totalQuestionsEl.textContent = questions.length;
            loadQuestion(currentQuestionIndex);
            generateQuestionsNavigation();
            updateStats();
            
            // 加载保存的进度
            const savedProgress = localStorage.getItem('quizProgress');
            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                userAnswers = progress.userAnswers;
                results = progress.results;
                updateQuestionsNavigation();
                updateStats();
            }
        }
        
        // 加载题目
        function loadQuestion(index) {
            const question = questions[index];
            
            // 更新题目信息
            currentQuestionIndex = index;
            currentChapterEl.textContent = question.chapter;
            currentQuestionEl.textContent = question.question;
            currentIndexEl.textContent = index + 1;
            
            // 设置题目类型
            let typeText = '';
            if (question.type === 'single') typeText = '[单选题] ';
            else if (question.type === 'multi') typeText = '[多选题] ';
            else if (question.type === 'judge') typeText = '[判断题] ';
            questionTypeEl.textContent = typeText;
            
            // 清空选项容器
            optionsContainerEl.innerHTML = '';
            
            // 生成选项
            question.options.forEach((option, idx) => {
                const optionEl = document.createElement('div');
                optionEl.className = 'option';
                
                const input = document.createElement('input');
                input.type = question.type === 'multi' ? 'checkbox' : 'radio';
                input.name = 'option';
                input.value = idx;
                
                const label = document.createElement('label');
                label.htmlFor = `option-${idx}`;
                label.textContent = option;
                
                optionEl.appendChild(input);
                optionEl.appendChild(label);
                
                // 添加选择事件
                optionEl.addEventListener('click', () => {
                    selectOption(optionEl, idx);
                });
                
                // 恢复已选答案
                if (userAnswers[index]) {
                    if (question.type === 'multi') {
                        if (userAnswers[index].includes(idx)) {
                            optionEl.classList.add('selected');
                            input.checked = true;
                        }
                    } else {
                        if (userAnswers[index] === idx) {
                            optionEl.classList.add('selected');
                            input.checked = true;
                        }
                    }
                }
                
                optionsContainerEl.appendChild(optionEl);
            });
            
            // 显示/隐藏提交按钮
            submitBtnEl.style.display = question.type === 'multi' ? 'block' : 'none';
            
            // 更新反馈
            if (results[index]) {
                showFeedback(results[index].isCorrect, question.answer);
            } else {
                feedbackEl.style.display = 'none';
            }
            
            // 更新导航按钮状态
            prevBtnEl.disabled = index === 0;
            nextBtnEl.disabled = index === questions.length - 1;
            
            // 设置章节选择
            chapterSelectEl.value = question.chapter;
        }
        
        // 选择选项
        function selectOption(optionEl, optionIndex) {
            const question = questions[currentQuestionIndex];
            const isMulti = question.type === 'multi';
            const options = optionsContainerEl.querySelectorAll('.option');
            
            if (isMulti) {
                // 多选题：切换选中状态
                optionEl.classList.toggle('selected');
                const checkbox = optionEl.querySelector('input');
                checkbox.checked = !checkbox.checked;
                
                // 更新用户答案
                if (!userAnswers[currentQuestionIndex]) {
                    userAnswers[currentQuestionIndex] = [];
                }
                
                const index = userAnswers[currentQuestionIndex].indexOf(optionIndex);
                if (index === -1) {
                    userAnswers[currentQuestionIndex].push(optionIndex);
                } else {
                    userAnswers[currentQuestionIndex].splice(index, 1);
                }
            } else {
                // 单选/判断题：直接选择
                options.forEach(opt => {
                    opt.classList.remove('selected');
                    opt.querySelector('input').checked = false;
                });
                
                optionEl.classList.add('selected');
                optionEl.querySelector('input').checked = true;
                
                // 更新用户答案
                userAnswers[currentQuestionIndex] = optionIndex;
                
                // 立即检查答案（非多选题）
                if (question.type !== 'multi') {
                    checkAnswer();
                }
            }
            
            // 更新导航状态
            updateQuestionsNavigation();
            updateStats();
            
            // 保存进度
            saveProgress();
        }
        
        // 提交答案（多选）
        submitBtnEl.addEventListener('click', checkAnswer);
        
        // 检查答案
        function checkAnswer() {
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];
            let isCorrect = false;
            
            if (question.type === 'multi') {
                // 多选题：检查答案（顺序无关）
                if (userAnswer && userAnswer.length === question.answer.length) {
                    const userAnswersSorted = userAnswer.sort().map(idx => question.options[idx][0]);
                    const correctAnswersSorted = [...question.answer].sort();
                    isCorrect = JSON.stringify(userAnswersSorted) === JSON.stringify(correctAnswersSorted);
                }
            } else {
                // 单选/判断题：检查答案
                const selectedOption = question.options[userAnswer];
                isCorrect = selectedOption.startsWith(question.answer);
            }
            
            // 保存结果
            results[currentQuestionIndex] = {
                isCorrect,
                userAnswer,
                correctAnswer: question.answer
            };
            
            // 显示反馈
            showFeedback(isCorrect, question.answer);
            
            // 更新导航状态
            updateQuestionsNavigation();
            updateStats();
            
            // 保存进度
            saveProgress();
        }
        
        // 显示反馈
        function showFeedback(isCorrect, correctAnswer) {
            feedbackEl.textContent = isCorrect 
                ? '✓ 回答正确！' 
                : `✗ 回答错误！正确答案是：${correctAnswer}`;
            
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
            
            // 多选题显示所有选项状态
                        // 多选题显示所有选项状态
            if (questions[currentQuestionIndex].type === 'multi') {
                const options = optionsContainerEl.querySelectorAll('.option');
                options.forEach((option, idx) => {
                    const optionLetter = questions[currentQuestionIndex].options[idx][0];
                    const isSelected = userAnswers[currentQuestionIndex]?.includes(idx);
                    
                    if (isSelected) {
                        const isCorrectAnswer = questions[currentQuestionIndex].answer.includes(optionLetter);
                        option.classList.toggle('correct', isCorrectAnswer);
                        option.classList.toggle('incorrect', !isCorrectAnswer);
                    } else {
                        const isCorrectAnswer = questions[currentQuestionIndex].answer.includes(optionLetter);
                        option.classList.toggle('correct', isCorrectAnswer);
                    }
                });
            } else {
                // 单选/判断题显示正确选项
                const options = optionsContainerEl.querySelectorAll('.option');
                options.forEach((option, idx) => {
                    const optionLetter = questions[currentQuestionIndex].options[idx][0];
                    const isCorrectAnswer = optionLetter === questions[currentQuestionIndex].answer;
                    
                    if (isCorrectAnswer) {
                        option.classList.add('correct');
                    } else {
                        option.classList.add('incorrect');
                    }
                });
            }
        }
        
        // 生成题目导航
        function generateQuestionsNavigation() {
            questionsNavEl.innerHTML = '';
            
            questions.forEach((_, index) => {
                const navItem = document.createElement('div');
                navItem.className = 'question-nav';
                navItem.textContent = index + 1;
                navItem.dataset.index = index;
                
                navItem.addEventListener('click', () => {
                    loadQuestion(index);
                });
                
                questionsNavEl.appendChild(navItem);
            });
            
            updateQuestionsNavigation();
        }
        
        // 更新题目导航状态
        function updateQuestionsNavigation() {
            const navItems = questionsNavEl.querySelectorAll('.question-nav');
            
            navItems.forEach((item, index) => {
                item.classList.remove('answered', 'correct', 'incorrect');
                
                if (results[index]) {
                    item.classList.add('answered');
                    item.classList.toggle('correct', results[index].isCorrect);
                    item.classList.toggle('incorrect', !results[index].isCorrect);
                }
            });
        }
        
        // 更新统计信息
        function updateStats() {
            const answeredCount = Object.keys(results).length;
            const correctCount = Object.values(results).filter(r => r.isCorrect).length;
            const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            const progress = Math.round((answeredCount / questions.length) * 100);
            
            completedCountEl.textContent = `${answeredCount}/${questions.length}`;
            accuracyRateEl.textContent = `${accuracy}%`;
            progressBarEl.style.width = `${progress}%`;
        }
        
        // 保存进度
        function saveProgress() {
            const progress = {
                userAnswers,
                results
            };
            localStorage.setItem('quizProgress', JSON.stringify(progress));
        }
        
        // 清除进度
        function resetProgress() {
            userAnswers = {};
            results = {};
            localStorage.removeItem('quizProgress');
            updateQuestionsNavigation();
            updateStats();
            loadQuestion(currentQuestionIndex);
        }
        
        // 切换章节
        chapterSelectEl.addEventListener('change', () => {
            const chapter = parseInt(chapterSelectEl.value);
            const chapterQuestions = questions.filter(q => q.chapter == chapter);
            
            if (chapterQuestions.length > 0) {
                const firstQuestionIndex = questions.findIndex(q => q.chapter == chapter);
                loadQuestion(firstQuestionIndex);
            }
        });
        
        // 上一题
        prevBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        });
        
        // 下一题
        nextBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex < questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            }
        });
        
        // 添加重置按钮
        const resetBtn = document.createElement('button');
        resetBtn.textContent = '重新开始';
        resetBtn.className = 'btn';
        resetBtn.style.background = '#e74c3c';
        resetBtn.style.color = 'white';
        resetBtn.style.marginTop = '20px';
        resetBtn.addEventListener('click', resetProgress);
        document.querySelector('.sidebar').appendChild(resetBtn);
        // 在 resetBtn 后面添加 "获取最新版" 按钮
        const updateBtn = document.createElement('button');
        updateBtn.textContent = '获取最新版';
        updateBtn.className = 'btn';
        updateBtn.style.background = '#3498db';
        updateBtn.style.color = 'white';
        updateBtn.style.marginTop = '20px';
        updateBtn.style.marginLeft = '10px';
        updateBtn.addEventListener('click', () => {
            // ================ 需要填写的网址 ================
            const updateUrl = 'https://pan.baidu.com/s/1k5oH-2YSGs3zQhRwnacfig?pwd=6e93';  // 在此处填写目标网址
            // ==============================================
            window.location.href = updateUrl;
        });
        document.querySelector('.sidebar').appendChild(updateBtn);
        
        // 初始化应用
        initApp();
    </script>
</body>
</html>
